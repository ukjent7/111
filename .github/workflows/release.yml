name: Release

# A version bump in Cargo.toml is the release signal. CI runs first (as a
# reusable call), then the targets build, and only `publish` creates the tag
# and the release — so a failed build never leaves a tag behind for someone
# to delete by hand. An unchanged version means there is nothing to release.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # whether this run can release at all: a version that has no release yet.
  # Checking here keeps a dep-bump commit from paying for the full matrix.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "Cargo.toml names no version"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: magpie-gateway-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: magpie-gateway-macos-arm64
          # the last Intel runner image (retires ~2027-08; Apple ships no
          # newer macOS for x86_64)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: magpie-gateway-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: magpie-gateway-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shared-key: release-${{ matrix.target }}
          # nothing downstream runs `cargo install`, so the reinstallable
          # binaries are dead weight in the cache; and rust-cache's bin
          # caching is known to misbehave on Windows (#341)
          cache-bin: "false"
      # the E2E suite drives the same release binary that gets shipped
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          dir=target/release
          [ -f "$dir/magpie-gateway.exe" ] && bin=magpie-gateway.exe || bin=magpie-gateway
          if [ "${{ runner.os }}" = Windows ]; then
            powershell -Command "Compress-Archive -Path '$dir/$bin' -DestinationPath '${{ matrix.artifact }}.zip' -Force"
          else
            tar czf "${{ matrix.artifact }}.tar.gz" -C "$dir" "$bin"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # only the build matrix's archives; the reusable CI's e2e reports
          # are artifacts too and must not become release assets
          pattern: magpie-gateway-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v$version"
          # idempotent: a rerun after a finished publish must not re-tag
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          # the tag is born here, at this exact commit, together with the
          # release — not before the build has proven itself
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --generate-notes
