name: Tag

# A version bump in Cargo.toml is the release signal: tag whatever it names,
# and Release builds and publishes it. Existing tags are left alone, so a push
# that doesn't bump the version does nothing.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the version Cargo.toml names
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "Cargo.toml names no version"; exit 1; }
          git fetch --tags origin
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
