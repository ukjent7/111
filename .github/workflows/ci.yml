name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # a newer push cancels an older run on a pull request; on main every commit
  # keeps its slot — canceling by ref would leave some pushes with no result
  # at all, and fmt.yml's dispatch and the release call share a push's sha
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # clippy and `cargo test` produce different artifacts, so running both on
  # every platform compiles all dependencies twice. Nothing in this crate is
  # platform-specific enough to lint differently per OS, so lint once, here,
  # and let the matrix only build and run. The matrix waits on it: a lint
  # failure should not buy three more minutes of compiling.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shared-key: lint
      # on main, fmt.yml is what keeps the sources formatted — and the commit
      # it pushes can't trigger this workflow, so the check stays with
      # pull requests
      - name: cargo fmt --check
        if: github.event_name == 'pull_request'
        run: cargo fmt --check --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked

  e2e:
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shared-key: e2e-${{ matrix.os }}
          # rust-cache's bin caching is known to misbehave on Windows
          # (Swatinem/rust-cache#341), and nothing here reinstalls the binary
          cache-bin: "false"
      - run: cargo test --locked
      # the JSON-shape e2e can't see the page: drive the real UI in a real
      # browser and fail on any uncaught script error, on every tab
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: UI smoke (real browser, every tab)
        if: runner.os == 'Linux'
        run: |
          npm i --no-save playwright@1.63.0
          node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e-report.json
            ui-smoke-report.json
