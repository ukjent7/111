name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # the JSON-shape e2e can't see the page: drive the real UI in a real
      # browser and fail on any uncaught script error, on every tab
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: UI smoke (real browser, every tab)
        if: runner.os == 'Linux'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e-report.json
            ui-smoke-report.json
