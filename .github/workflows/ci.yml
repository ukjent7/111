name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push supersedes an older run on the same ref; fmt.yml's own
  # commits land on main, and a full 3-platform matrix each time is waste
  cancel-in-progress: true

env:
  # CI never needs a full DWARF dump, only backtraces that name a file and a
  # line. Dropping the rest makes every compile faster and shrinks target/
  # enough to cut the cache upload, which is the slowest part of the Windows
  # leg. Only the dev profile (and `test`, which inherits it) is affected —
  # the release profile has debug info off already, so shipped binaries are
  # byte-for-byte unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # clippy and `cargo test` produce different artifacts, so running both on
  # every platform compiles all dependencies twice. Nothing in this crate is
  # platform-specific enough to lint differently per OS, so lint once, here,
  # and let the matrix only build and run. The matrix waits on it: a lint
  # failure should not buy three more minutes of compiling.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      # its own cache slot: clippy's artifacts would otherwise evict the
      # test build's on every run
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-${{ matrix.os }}
          # rust-cache's bin caching is known to misbehave on Windows
          # (Swatinem/rust-cache#341), and nothing here reinstalls the binary
          cache-bin: "false"
      - run: cargo test
      # the JSON-shape e2e can't see the page: drive the real UI in a real
      # browser and fail on any uncaught script error, on every tab
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 22
      - name: UI smoke (real browser, every tab)
        if: runner.os == 'Linux'
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            e2e-report.json
            ui-smoke-report.json
