name: Dependencies

# `tao`, `wry` and `reqwest` are 0.x, where a caret requirement can't cross a
# minor — so nothing moves them to the newest release on its own. Once a month
# this bumps every dependency and proves the result still builds: lint and the
# E2E suite have to pass before the pull request is opened, so an incompatible
# upgrade shows up as a red run instead of a surprise in someone's build.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependencies
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bump every dependency to its newest release
        run: |
          cargo install cargo-edit --locked
          cargo upgrade --incompatible
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet Cargo.toml && { echo "already on the newest releases"; exit 0; }
          branch=deps/$(date -u +%Y-%m)
          git switch -c "$branch"
          git add Cargo.toml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "dependencies: newest stable releases"
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "dependencies: newest stable releases"
          else
            gh pr create --base main --head "$branch" \
              --title "dependencies: newest stable releases" \
              --body "A month's worth of upstream releases, bumped by \`cargo upgrade --incompatible\`. Lint and the E2E suite passed on the branch."
          fi
