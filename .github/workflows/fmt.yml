name: Format

# The machine that writes the code has no Rust toolchain, so rustfmt runs
# here instead: whatever lands on main comes back formatted, which is what
# keeps CI's `cargo fmt --check` green. Idempotent — a run with nothing to
# format ends without committing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit the formatted sources
        run: |
          git add src tests Cargo.toml
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "cargo fmt"
          git push origin main
