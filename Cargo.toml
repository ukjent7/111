[package]
name = "magpie-gateway"
version = "0.5.2"
edition = "2024"
rust-version = "1.98.1"
description = "Magpie local API gateway with pass-through support"
authors = ["kk"]

[dependencies]
anyhow = "1"
arboard = "3"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
include_dir = "0.7"
jiff = "0.2"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wry = "0.57"

# CI's `-D warnings`, moved here so the local build, the IDE and the workflow
# all deny the same things
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.dev]
# CI never needs a full DWARF dump, only backtraces that name a file and a
# line. Dropping the rest makes every compile faster and shrinks target/
# enough to cut the cache upload, which is the slowest part of the Windows
# leg. Release has debug info off already, so shipped binaries are
# byte-for-byte unaffected.
debug = "line-tables-only"

# Dependencies never need debug info; this only costs time on the cold /
# dep-changed builds that populate the CI cache.
[profile.dev.package."*"]
debug = false

[profile.release]
# A release build runs a few times a year, so the slower optimum settings are
# free: the shipped binary comes out smaller and faster.
lto = true
codegen-units = 1
strip = true
