[package]
name = "magpie-gateway"
version = "0.1.0"
edition = "2024"
description = "Magpie local API gateway with pass-through support"
authors = ["kk"]

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures = "0.3"
serde_json = "1"
